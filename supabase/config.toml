# Supabase CLI configuration for LOCAL development (`supabase start`).
# Hosted projects are configured in the Supabase dashboard — see docs/SETUP.md.
project_id = "cafeteria-meal-tracker"

[api]
enabled = true
port = 54321
# Only "public" is exposed through the Data API. Helper functions live in the
# "private" schema and cannot be called by clients.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
# Staff accounts are created by an administrator; nobody can self-register.
enable_signup = false
enable_refresh_token_rotation = true

[auth.email]
enable_signup = false
enable_confirmations = false
